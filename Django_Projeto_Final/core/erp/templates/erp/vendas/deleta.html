<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta title="Deleção venda - ERP">
</head>
<body>
    <h1>Deletar venda {{ venda.id }}</h1>

    <form method="post">
        {% csrf_token %}
        <p>Tem certeza que deseja deletar a venda {{ venda.id }}?</p>
        <button type="submit">Confirmar Deleção</button>
    </form>
</body>
</html>
