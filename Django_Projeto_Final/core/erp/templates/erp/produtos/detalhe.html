<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta title="Detalhes do Produto - ERP">
</head>
<body>
    
    <h1>Detalhes do Produto {{ produto.nome }}</h1>

    {% if produto %}
        {% if produto.imagem %}
            <img src="{{ produto.imagem.url }}" alt="Imagem do {{ produto.nome }}" width="200px">
        {% endif %}
        <ul>
            <li><b>Nome:</b> {{ produto.nome }}</li>
            <li><b>Descrição:</b> {{ produto.descricao }}</li>
            <li><b>Preço:</b> {{ produto.preco }}</li>
        </ul>
    {% else %}
        <p>Produto não encontrado.</p>
    {% endif %}
</body>
</html>
